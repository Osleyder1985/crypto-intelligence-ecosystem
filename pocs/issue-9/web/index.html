<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Issue 9 — OHLCV chart reference</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0 auto; max-width: 1100px; padding: 1rem; }
    header { display:flex; flex-wrap:wrap; align-items:baseline; gap:.75rem; }
    .notice { padding:.65rem; border:1px solid currentColor; border-radius:.4rem; }
    canvas { display:block; width:100%; height:440px; border:1px solid #8888; }
    #status { min-height:1.5em; }
    .legend { display:flex; gap:1rem; flex-wrap:wrap; }
    button { min-height:2.5rem; padding:.4rem .8rem; }
  </style>
</head>
<body>
  <header><h1>Market chart reference PoC</h1><span>Issue #9 · OHLCV fixture v1.0.0</span></header>
  <p class="notice">Synthetic test data only. This screen is not market data and does not generate investment signals.</p>
  <p id="status" role="status" aria-live="polite">Loading fixture…</p>
  <div class="legend"><span>🟩 Close ≥ open</span><span>🟥 Close &lt; open</span><span>Bars below show volume</span></div>
  <canvas id="chart" width="1100" height="440" role="img" aria-label="Candlestick chart and volume bars for the synthetic fixture. A textual data table follows."></canvas>
  <h2>Underlying candle data</h2>
  <div style="overflow-x:auto"><table id="data"><thead><tr><th scope="col">UTC timestamp</th><th scope="col">Open</th><th scope="col">High</th><th scope="col">Low</th><th scope="col">Close</th><th scope="col">Volume</th></tr></thead><tbody></tbody></table></div>
  <script type="module" src="./chart.js"></script>
</body>
</html>
