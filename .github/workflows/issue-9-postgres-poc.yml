name: Issue 9 PostgreSQL history proof of concept

on:
  pull_request:
    paths:
      - 'scripts/stack_poc/postgres_schema.sql'
      - 'tests/stack_poc/test_postgres_history.py'
      - '.github/workflows/issue-9-postgres-poc.yml'
  push:
    branches: [main, docs/issue-9-stack-evaluation]
    paths:
      - 'scripts/stack_poc/postgres_schema.sql'
      - 'tests/stack_poc/test_postgres_history.py'
      - '.github/workflows/issue-9-postgres-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-history:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stackpoc
          POSTGRES_PASSWORD: stackpoc-test-only
          POSTGRES_DB: stackpoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackpoc -d stackpoc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STACK_POC_POSTGRES_DSN: postgresql://stackpoc:stackpoc-test-only@localhost:5432/stackpoc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL driver
        run: python -m pip install --disable-pip-version-check psycopg[binary]==3.2.6
      - name: Run PostgreSQL history tests
        run: python -m unittest discover -s tests/stack_poc -p 'test_postgres_history.py' -v
