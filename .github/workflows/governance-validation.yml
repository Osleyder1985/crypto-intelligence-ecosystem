name: Validación de gobernanza
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gobernanza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar-gobernanza:
    name: validar-gobernanza
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/quality/check_governance.py
      - name: Pruebas del validador de readiness
        run: python -m unittest discover -s tests/quality -p "test_*.py" -v
