name: Validación de gobernanza

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gobernanza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-gobernanza:
    name: validar-gobernanza
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Comprobar contratos documentales de gobernanza
        run: python scripts/quality/check_governance.py
