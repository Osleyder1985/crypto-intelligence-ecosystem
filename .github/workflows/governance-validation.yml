name: Validación de gobernanza
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gobernanza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar-gobernanza:
    name: validar-gobernanza
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/quality/check_governance.py
      - name: Pruebas del validador de readiness
        run: python -m unittest discover -s tests/quality -p "test_*.py" -v
