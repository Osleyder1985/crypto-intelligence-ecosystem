name: Issue 9 OpenAPI contract validation

on:
  pull_request:
    paths:
      - 'docs/architecture/stack-poc-openapi.yaml'
      - '.github/workflows/issue-9-openapi-contract.yml'
  push:
    branches: [main, docs/issue-9-stack-evaluation]
    paths:
      - 'docs/architecture/stack-poc-openapi.yaml'
      - '.github/workflows/issue-9-openapi-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned OpenAPI validator
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
      - name: Validate the OpenAPI 3.1 contract
        run: openapi-spec-validator docs/architecture/stack-poc-openapi.yaml
