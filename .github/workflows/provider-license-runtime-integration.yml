name: Provider license runtime enforcement integration

on:
  pull_request:
    paths:
      - "scripts/market_selection/provider_license_gate.py"
      - "scripts/market_selection/capture_binance_spot_ohlcv.py"
      - "scripts/market_selection/capture_public_market_batch.py"
      - "scripts/market_selection/capture_public_market_data.py"
      - "tests/market_selection/test_provider_license_gate.py"
      - "tests/market_selection/test_capture_binance_spot_ohlcv.py"
      - "tests/market_selection/test_capture_public_market_batch.py"
      - "tests/market_selection/test_public_market_capture.py"
      - ".github/workflows/provider-license-runtime-integration.yml"
  push:
    branches: [main]
    paths:
      - "scripts/market_selection/provider_license_gate.py"
      - "scripts/market_selection/capture_binance_spot_ohlcv.py"
      - "scripts/market_selection/capture_public_market_batch.py"
      - "tests/market_selection/test_provider_license_gate.py"
      - "tests/market_selection/test_capture_binance_spot_ohlcv.py"
      - "tests/market_selection/test_capture_public_market_batch.py"
      - ".github/workflows/provider-license-runtime-integration.yml"

permissions:
  contents: read

jobs:
  runtime-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Test policy and runtime capture gates
        run: |
          python -m unittest discover -s tests/market_selection -p "test_provider_license_gate.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_binance_spot_ohlcv.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_public_market_batch.py" -v
          python -m unittest discover -s tests/market_selection -p "test_public_market_capture.py" -v
