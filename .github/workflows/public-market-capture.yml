name: Public market API capture (read-only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.detect.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        run: |
          if [ -f scripts/market_selection/capture_public_market_data.py ]; then echo "applicable=true" >> "$GITHUB_OUTPUT"; else echo "applicable=false" >> "$GITHUB_OUTPUT"; fi
  capture-public-market-data:
    name: Capture bounded public market universe
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run capture with fail-closed provider authorization
        continue-on-error: true
        run: python scripts/market_selection/capture_public_market_data.py
      - name: Validate blocked providers and auditable decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("artifacts/public-market-capture.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "public-market-capture-v1"
          assert artifact["overall_status"] == "FAIL"
          records = {record["provider"]: record for record in artifact["records"]}
          assert set(records) == {"pionex", "binance_exchange_info", "binance_depth"}
          pionex = records["pionex"]
          assert pionex["capture_status"] == "BLOCKED"
          assert pionex["provider_use_assessment"]["decision"] == "BLOCK"
          assert pionex["http_status"] is None and pionex["response_bytes"] is None
          for provider in ("binance_exchange_info", "binance_depth"):
              assert records[provider]["provider_use_assessment"]["decision"] == "ALLOW"
          print("Pionex request blocked before network: authorization record absent.")
          print("Binance requests are limited to live technical test; this is not commercial authorization.")
          PY
      - name: Upload timestamped capture and raw-response evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-market-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-market-capture.json
          if-no-files-found: error
          retention-days: 14
