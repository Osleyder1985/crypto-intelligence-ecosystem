name: Public market API capture (read-only)

on:
  pull_request:
    paths:
      - "scripts/market_selection/capture_public_market_data.py"
      - ".github/workflows/public-market-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-market-data:
    name: Capture public Pionex and Binance data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture public API responses
        id: capture
        run: python scripts/market_selection/capture_public_market_data.py
      - name: Upload timestamped capture and raw-response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-market-capture.json
          if-no-files-found: error
          retention-days: 14
