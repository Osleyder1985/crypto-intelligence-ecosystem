name: Issue 9 Flutter chart reference PoC

on:
  pull_request:
    paths:
      - 'pocs/issue-9/flutter/**'
      - 'tests/stack_poc/fixtures/ohlcv_synthetic_v1.json'
      - '.github/workflows/issue-9-flutter-poc.yml'
  push:
    branches: [main, docs/issue-9-stack-evaluation]
    paths:
      - 'pocs/issue-9/flutter/**'
      - 'tests/stack_poc/fixtures/ohlcv_synthetic_v1.json'
      - '.github/workflows/issue-9-flutter-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-chart-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify app fixture matches canonical fixture byte-for-byte
        run: cmp tests/stack_poc/fixtures/ohlcv_synthetic_v1.json pocs/issue-9/flutter/assets/ohlcv_synthetic_v1.json
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record Flutter toolchain
        run: flutter --version
      - name: Resolve Flutter packages
        working-directory: pocs/issue-9/flutter
        run: flutter pub get
      - name: Run Flutter widget tests
        working-directory: pocs/issue-9/flutter
        run: flutter test
      - name: Build Android debug APK and record runner measurements
        working-directory: pocs/issue-9/flutter
        run: |
          /usr/bin/time -v flutter build apk --debug 2>&1 | tee flutter-build-measurement.log
          stat --printf='APK_BYTES=%s\n' build/app/outputs/flutter-apk/app-debug.apk
