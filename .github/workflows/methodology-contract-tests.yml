name: Investment methodology contract tests

on:
  pull_request:
    paths:
      - "scripts/market_selection/methodology_contract.py"
      - "scripts/market_selection/validation_evidence_contract.py"
      - "tests/market_selection/test_methodology_contract.py"
      - "tests/market_selection/test_validation_evidence_contract.py"
      - "docs/engineering/issue-133-methodology-contract.md"
      - "docs/engineering/issue-133-validation-evidence-contract.md"
      - ".github/workflows/methodology-contract-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/market_selection/methodology_contract.py"
      - "scripts/market_selection/validation_evidence_contract.py"
      - "tests/market_selection/test_methodology_contract.py"
      - "tests/market_selection/test_validation_evidence_contract.py"
      - "docs/engineering/issue-133-methodology-contract.md"
      - "docs/engineering/issue-133-validation-evidence-contract.md"
      - ".github/workflows/methodology-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Run methodology and validation evidence contract tests
        run: |
          python -m unittest discover -s tests/market_selection -p "test_methodology_contract.py" -v
          python -m unittest discover -s tests/market_selection -p "test_validation_evidence_contract.py" -v
