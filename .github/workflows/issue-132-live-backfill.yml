name: Captura histórica real y manifiesto reproducible — Issue 132

on:
  pull_request:
    paths:
      - "scripts/market_selection/event_source_registry.py"
      - "scripts/market_selection/capture_public_event_feed.py"
      - "scripts/market_selection/capture_public_event_archive.py"
      - "scripts/market_selection/run_issue_132_live_backfill.py"
      - "config/provider_authorization_registry.issue-132.json"
      - ".github/workflows/issue-132-live-backfill.yml"

permissions:
  contents: write

jobs:
  live-backfill:
    if: github.head_ref == 'feat/issue-132-source-scoped-archive-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar capturas reales secuenciales con autorización por fuente
        run: |
          PYTHONPATH=. python scripts/market_selection/run_issue_132_live_backfill.py \
            --authorization-registry config/provider_authorization_registry.issue-132.json \
            --output-dir "$RUNNER_TEMP/issue-132-live-backfill"
      - name: Persistir expediente de evidencia autorizado en la rama del PR
        if: success()
        run: |
          destination="data/research_evidence/issue-132/live-backfill"
          mkdir -p "$destination"
          cp -R "$RUNNER_TEMP/issue-132-live-backfill/." "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "data: persist verified Issue 132 backfill evidence"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi
      - name: Publicar capturas derivadas y manifiesto verificable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-132-live-backfill
          path: ${{ runner.temp }}/issue-132-live-backfill/
          if-no-files-found: warn
          retention-days: 30
