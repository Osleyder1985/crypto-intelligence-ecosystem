name: Multi-pair public market capture (read-only)

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Test multi-pair capture and evaluation offline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/market_selection -p "test_evaluate_capture_batch.py" -v
      - run: python -m unittest discover -s tests/market_selection -p "test_analyze_depth_cost_curves.py" -v
      - run: python -m unittest discover -s tests/market_selection -p "test_issue18_live_freshness.py" -v
      - run: python -m unittest discover -s tests/market_selection -p "test_minimum_common_notional_scenario.py" -v
      - run: python -m unittest discover -s tests/market_selection -p "test_capture_pionex_fill_fee_evidence.py" -v

  capture-offline:
    name: Test multi-pair capture offline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/market_selection -p "test_capture_public_market_batch.py" -v

  live-capture:
    name: Capture and evaluate bounded public market universe
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Capture only providers allowed by policy
        continue-on-error: true
        run: python scripts/market_selection/capture_public_market_batch.py
      - name: Assert fail-closed provider decisions
        run: |
          python -c 'import json; from pathlib import Path; a=json.loads(Path("artifacts/public-market-capture-batch.json").read_text()); assert a["schema_version"] == "public-market-capture-batch-v1"; assert a["overall_status"] == "FAIL"; assert len(a["records"]) == 12; p=[r for r in a["records"] if str(r["provider"]).startswith("pionex")]; b=[r for r in a["records"] if str(r["provider"]).startswith("binance")]; assert len(p) == 6 and all(r["capture_status"] == "BLOCKED" and r["provider_use_assessment"]["decision"] == "BLOCK" and r["http_status"] is None for r in p); assert len(b) == 6 and all(r["provider_use_assessment"]["decision"] == "ALLOW" for r in b); print("Pionex blocked before network; Binance allowed only for technical test.")'
      - name: Preserve authorization audit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-market-capture-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
