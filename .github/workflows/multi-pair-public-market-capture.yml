name: Multi-pair public market capture (read-only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.detect.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        run: |
          if [ -f scripts/market_selection/capture_public_market_batch.py ] && [ -f tests/market_selection/test_evaluate_capture_batch.py ] && [ -f tests/market_selection/test_capture_public_market_batch.py ]; then echo "applicable=true" >> "$GITHUB_OUTPUT"; else echo "applicable=false" >> "$GITHUB_OUTPUT"; fi
  offline-tests:
    name: Test multi-pair capture and evaluation offline
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/market_selection -p "test_evaluate_capture_batch.py" -v
  capture-offline:
    name: Test multi-pair capture offline
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/market_selection -p "test_capture_public_market_batch.py" -v
  live-capture:
    name: Capture and evaluate bounded public market universe
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/market_selection/capture_public_market_batch.py
      - name: Validate batch structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("artifacts/public-market-capture-batch.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "public-market-capture-batch-v1"
          assert artifact["overall_status"] == "PASS"
          assert artifact["expected_record_count"] == artifact["actual_record_count"] == 9
          assert len(artifact["universe"]) == 3
          assert len({item["pionex_symbol"] for item in artifact["universe"]}) == 3
          PY
      - name: Evaluate batch twice and compare outputs without an unapproved scenario
        run: |
          set -euo pipefail
          python scripts/market_selection/evaluate_capture_batch.py --artifact artifacts/public-market-capture-batch.json --output artifacts/batch-evaluation-1.json
          python scripts/market_selection/evaluate_capture_batch.py --artifact artifacts/public-market-capture-batch.json --output artifacts/batch-evaluation-2.json
          cmp --silent artifacts/batch-evaluation-1.json artifacts/batch-evaluation-2.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/batch-evaluation-1.json").read_text(encoding="utf-8"))
          assert result["markets_evaluated"] == 3
          assert result["decision_status"] == "INDETERMINATE"
          assert result["orders_submitted"] is False
          assert result["network_requests_made"] is False
          assert result["config_approved"] is False
          assert all(m["dimension_status"]["capture_integrity"] == "PASS" for m in result["markets"])
          assert all(m["dimension_status"]["source_freshness"] == "INDETERMINATE" for m in result["markets"])
          assert all(m["dimension_status"]["fees"] == "INDETERMINATE" for m in result["markets"])
          PY
      - name: Upload capture and evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-market-capture-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
