name: Issue 9 stack API proof of concept

on:
  pull_request:
    paths:
      - 'scripts/stack_poc/**'
      - 'tests/stack_poc/**'
      - 'requirements-stack-poc.txt'
      - 'docs/architecture/evidence/issue-9-partial-score-input.json'
      - 'docs/architecture/evidence/issue-9-partial-score-input.json'
      - '.github/workflows/issue-9-stack-poc.yml'
  push:
    branches: [main, docs/issue-9-stack-evaluation]
    paths:
      - 'scripts/stack_poc/**'
      - 'tests/stack_poc/**'
      - 'requirements-stack-poc.txt'
      - '.github/workflows/issue-9-stack-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-history-idempotency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned PoC dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-stack-poc.txt
      - name: Validate shared synthetic OHLCV benchmark fixture
        run: python -m unittest discover -s tests/stack_poc -p 'test_shared_ohlcv_fixture.py' -v
      - name: Test evidence-gated scoring and sensitivity analysis
        run: python -m unittest discover -s tests/stack_poc -p 'test_sensitivity_analysis.py' -v
      - name: Generate evidence-backed partial score report without ranking
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python scripts/stack_poc/sensitivity_analysis.py docs/architecture/evidence/issue-9-partial-score-input.json --output artifacts/issue-9-partial-score-output.json
          result=$?
          set -e
          test "$result" -eq 2
          python -c "import json; d=json.load(open('artifacts/issue-9-partial-score-output.json')); assert d['status']=='incomplete'; assert d['ranking']==[] and d['sensitivity']==[]; assert [x['weight_coverage_percent'] for x in d['partial_scores']]==[35,35,50,10]; assert [x['partial_score_out_of_100'] for x in d['partial_scores']]==[74.2857,74.2857,60.0,60.0]"
      - name: Preserve partial scoring output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-9-partial-scoring-report
          path: artifacts/issue-9-partial-score-output.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run API, history and idempotency PoC tests
        run: python -m unittest discover -s tests/stack_poc -p 'test_research_api.py' -v
      - name: Run worker concurrency and transaction-recovery tests
        run: python -m unittest discover -s tests/stack_poc -p 'test_worker_reliability.py' -v
      - name: Run OpenAPI client-server contract conformance tests
        run: python -m unittest discover -s tests/stack_poc -p 'test_openapi_contract_conformance.py' -v
