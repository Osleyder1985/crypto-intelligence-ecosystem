name: Requirements traceability validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.detect.outputs.applicable }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: detect
        run: |
          if [ -f scripts/quality/validate_requirements_catalog.py ] && [ -f tests/quality/test_validate_requirements_catalog.py ]; then echo "applicable=true" >> "$GITHUB_OUTPUT"; else echo "applicable=false" >> "$GITHUB_OUTPUT"; fi
  validate-requirements:
    name: Validate requirements catalogue and traceability
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test requirements validator
        run: python -m unittest discover -s tests/quality -p 'test_*.py' -v
      - name: Validate requirements catalogue
        run: python scripts/quality/validate_requirements_catalog.py
