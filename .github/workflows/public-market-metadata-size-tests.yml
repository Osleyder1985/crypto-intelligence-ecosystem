name: Public market metadata complete-response regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  large-response-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test complete metadata response capture above 5 MiB
        run: python -m unittest discover -s tests/market_selection -p "test_capture_public_market_data.py" -v
