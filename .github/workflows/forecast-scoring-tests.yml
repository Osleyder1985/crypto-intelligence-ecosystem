name: Reproducible forecast scoring tests

on:
  pull_request:
    paths:
      - "scripts/market_selection/forecast_scoring.py"
      - "tests/market_selection/test_forecast_scoring.py"
      - "docs/engineering/issue-133-forecast-scoring.md"
      - ".github/workflows/forecast-scoring-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/market_selection/forecast_scoring.py"
      - "tests/market_selection/test_forecast_scoring.py"
      - "docs/engineering/issue-133-forecast-scoring.md"
      - ".github/workflows/forecast-scoring-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Run forecast scoring tests
        run: python -m unittest discover -s tests/market_selection -p "test_forecast_scoring.py" -v
