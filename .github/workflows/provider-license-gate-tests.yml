name: Provider license runtime gate tests

on:
  pull_request:
    paths:
      - "scripts/market_selection/provider_license_gate.py"
      - "tests/market_selection/test_provider_license_gate.py"
      - "tests/market_selection/test_provider_license_enforcement.py"
      - "scripts/market_selection/capture_binance_account_commission_evidence.py"
      - "scripts/market_selection/capture_pionex_fill_fee_evidence.py"
      - ".github/workflows/provider-license-gate-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/market_selection/provider_license_gate.py"
      - "tests/market_selection/test_provider_license_gate.py"
      - "tests/market_selection/test_provider_license_enforcement.py"
      - "scripts/market_selection/capture_binance_account_commission_evidence.py"
      - "scripts/market_selection/capture_pionex_fill_fee_evidence.py"
      - ".github/workflows/provider-license-gate-tests.yml"

permissions:
  contents: read

jobs:
  provider-license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Run provider license gate tests
        run: python -m unittest discover -s tests/market_selection -p "test_provider_license_*.py" -v
