      - "tests/market_selection/test_detect_ohlcv_movement_events.py"
      - "scripts/market_selection/analyze_support_resistance.py"
      - "tests/market_selection/test_analyze_support_resistance.py"
      - ".github/workflows/provider-license-gate-tests.yml"

permissions:
  contents: read

jobs:
  provider-license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97d
        with:
          python-version: "3.12"
      - name: Run provider license gate and authorized-consumer tests
        run: |
          python -m unittest discover -s tests/market_selection -p "test_provider_license_*.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_multi_exchange_spot_book_probe.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_binance_account_commission_evidence.py" -v
          python -m unittest discover -s tests/market_selection -p "test_data_contract_and_binance.py" -v
          python -m unittest discover -s tests/market_selection -p "test_pionex_public.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_multi_exchange_spot_ticker_probe.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_binance_spot_ohlcv.py" -v
          python -m unittest discover -s tests/market_selection -p "test_capture_binance_regional_rest_diagnostic.py" -v
          python -m unittest discover -s tests/market_selection -p "test_binance_depth_transport.py" -v
          python -m unittest discover -s tests/market_selection -p "test_research_report.py" -v
          python -m unittest discover -s tests/market_selection -p "test_selector.py" -v
          python -m unittest discover -s tests/market_selection -p "test_analyze_depth_cost_curves.py" -v
          python -m unittest discover -s tests/market_selection -p "test_analyze_quote_volume_series.py" -v
          python -m unittest discover -s tests/market_selection -p "test_analyze_spot_market_pareto.py" -v
          python -m unittest discover -s tests/market_selection -p "test_minimum_common_notional_scenario.py" -v
          python -m unittest discover -s tests/market_selection -p "test_analyze_ohlcv_risk_profile.py" -v
          python -m unittest discover -s tests/market_selection -p "test_detect_ohlcv_movement_events.py" -v
          python -m unittest discover -s tests/market_selection -p "test_analyze_support_resistance.py" -v
          python -m unittest discover -s tests/market_selection -p "test_research_evidence_integration.py" -v
