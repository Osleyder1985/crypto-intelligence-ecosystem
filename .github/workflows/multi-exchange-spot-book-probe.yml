name: Multi-exchange spot book probe

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/market_selection/capture_multi_exchange_spot_book_probe.py"
      - "tests/market_selection/test_capture_multi_exchange_spot_book_probe.py"
      - ".github/workflows/multi-exchange-spot-book-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline contract tests
        run: python -m unittest tests.market_selection.test_capture_multi_exchange_spot_book_probe -v

  live-public-capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture public spot order books
        id: capture
        continue-on-error: true
        run: python -m scripts.market_selection.capture_multi_exchange_spot_book_probe
      - name: Upload immutable capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-exchange-spot-book-probe
          path: artifacts/multi-exchange-spot-book-probe.json
          if-no-files-found: error
          retention-days: 14
      - name: Report live capture status
        if: steps.capture.outcome != 'success'
        run: echo "One or more public exchange captures failed; artifact preserves per-exchange outcomes." 
