name: External event evidence contract tests

on:
  pull_request:
    paths:
      - "scripts/market_selection/external_event_evidence.py"
      - "tests/market_selection/test_external_event_evidence.py"
      - ".github/workflows/external-event-evidence-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/market_selection/external_event_evidence.py"
      - "tests/market_selection/test_external_event_evidence.py"
      - ".github/workflows/external-event-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run external event evidence tests
        run: python -m unittest discover -s tests/market_selection -p "test_external_event_evidence.py" -v
